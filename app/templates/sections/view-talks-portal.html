(function initTk() {
    var sel = document.getElementById('tkCat');
    if (sel && sel.options.length === 1) {
        Object.keys(TK_CATS).forEach(function(k) {
            var o = document.createElement('option'); o.value = k; o.textContent = TK_CATS[k]; sel.appendChild(o);
        });
    }
})();

function tkEscape(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function tkIsLive(slug) {
    return (typeof _sectionMap !== 'undefined') && !!_sectionMap[slug];
}

var TK_RENDER_CAP = 400; // grid stays snappy; search narrows the rest

function tkRender() {
    var q = (document.getElementById('tkSearch').value || '').toLowerCase().trim();
    var cat = document.getElementById('tkCat').value;
    var status = document.getElementById('tkStatus').value;
    var out = document.getElementById('tkResults');
    var html = '', n = 0, shown = 0;
    TK.forEach(function(t) {
        var slug = t[0], title = t[1], key = t[2], presenter = t[3] || '';
        if (cat && key !== cat) return;
        var live = tkIsLive(slug);
        if (status === 'live' && !live) return;
        if (status === 'planned' && live) return;
        var hay = (title + ' ' + presenter + ' ' + (TK_CATS[key] || '')).toLowerCase();
        if (q && hay.indexOf(q) === -1) return;
        n++;
        if (shown >= TK_RENDER_CAP) return;
        shown++;
        var badge = live
            ? '<span style="font-size:0.62rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--success); border:1px solid var(--success); border-radius:99px; padding:0.1rem 0.5rem;">Available</span>'
            : '<span style="font-size:0.62rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-faint); border:1px solid var(--card-border); border-radius:99px; padding:0.1rem 0.5rem;">Planned</span>';
        var open = live ? ' onclick="showSection(\'' + slug + '\')" onmouseover="this.style.borderColor=\'var(--accent)\'" onmouseout="this.style.borderColor=\'var(--card-border)\'"' : '';
        html += '<div' + open + ' style="cursor:' + (live ? 'pointer' : 'default') + '; border:1px solid var(--card-border); border-radius:8px; padding:0.7rem 0.9rem; background:var(--metric-bg); transition:border-color 0.15s;' + (live ? '' : ' opacity:0.65;') + '">' +
            '<div style="display:flex; justify-content:space-between; align-items:center; gap:0.5rem;">' +
            '<div style="font-size:0.68rem; color:var(--accent); font-weight:700; text-transform:uppercase; letter-spacing:0.03em;">' + tkEscape(TK_CATS[key] || key) + '</div>' + badge + '</div>' +
            '<div style="font-weight:600; font-size:0.9rem; margin-top:0.25rem;">' + tkEscape(title) + '</div>' +
            (presenter ? '<div style="font-size:0.78rem; color:var(--text-muted); margin-top:0.2rem;">' + tkEscape(presenter) + '</div>' : '') +
            '</div>';
    });
    out.innerHTML = html || '<div style="color: var(--text-muted); padding:1rem;">No talks match your filters.</div>';
    document.getElementById('tkCount').textContent = n + ' talk' + (n === 1 ? '' : 's') + ' matched' +
        (shown < n ? ' (showing first ' + shown + ' — refine your search)' : '') + (q ? ' for “' + q + '”' : '');
}
setTimeout(tkRender, 300);
